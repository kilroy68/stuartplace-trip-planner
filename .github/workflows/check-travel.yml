name: Check travel planners
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check assets/home.js
          node --check assets/future-trips.js
          node --check new-england-trip/planner.js
      - name: Check itinerary and map
        run: python3 tests/check_travel.py
      - name: Check travel interactions
        run: |
          npm install --prefix /tmp/travel-check --no-audit --no-fund jsdom@30.1.3
          NODE_PATH=/tmp/travel-check/node_modules node tests/ui.cjs
          NODE_PATH=/tmp/travel-check/node_modules node tests/future_trips.cjs
